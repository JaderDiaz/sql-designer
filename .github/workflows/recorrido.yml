# El recorrido de `specs/002-archivos-modelo/quickstart.md`: los ocho
# escenarios sobre la aplicación de verdad.
#
# Va aparte de las puertas porque es lento —compila el binario con la bandera
# `webdriver`— y porque necesita una ventana de verdad, así que solo corre en
# macOS. En Windows el montaje todavía está pendiente.
name: Recorrido

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: recorrido-${{ github.ref }}
  cancel-in-progress: true

jobs:
  escenarios:
    name: Los ocho escenarios en macOS
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Recorrido completo
        run: npm run e2e

      - name: Guardar el registro de la aplicación si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registro-de-la-aplicacion
          path: ~/Library/Logs/com.jaderdiaz.sql-designer/sql-designer.log
          if-no-files-found: ignore
