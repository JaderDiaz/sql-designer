# El recorrido de `specs/002-archivos-modelo/quickstart.md`: los ocho
# escenarios sobre la aplicación de verdad.
#
# Va aparte de las puertas porque es lento: compila el binario con la bandera
# `webdriver`. Corre en las dos plataformas del producto, y ahí comprueba lo
# que cambia con el sistema —símbolos de atajo, nombre del gestor de archivos,
# rutas del estado del usuario— sin que haga falta una persona delante.
name: Recorrido

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: recorrido-${{ github.ref }}
  cancel-in-progress: true

jobs:
  escenarios:
    name: Los ocho escenarios en ${{ matrix.sistema }}
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 60
    strategy:
      # Si una plataforma falla, la otra termina igual.
      fail-fast: false
      matrix:
        sistema: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Recorrido completo
        run: npm run e2e

      - name: Guardar el registro de la aplicación si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registro-de-la-aplicacion-${{ matrix.sistema }}
          path: |
            ~/Library/Logs/com.jaderdiaz.sql-designer/sql-designer.log
            ~/AppData/Local/com.jaderdiaz.sql-designer/logs/sql-designer.log
          if-no-files-found: ignore
