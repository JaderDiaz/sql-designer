formatVersion: 1
name: Recorrido · Tablas y campos
engine: postgres
schemas:
  - name: ventas
    abbreviation: VEN
    color: blue
    comment: Facturación y cobros
  - name: inventario
    abbreviation: INV
    color: green
  - name: personas
    abbreviation: PER
    color: purple
tables:
  - name: facturas
    schema: ventas
    comment: Cabecera de la factura
    fields:
      - name: id
        type: uuid
        default: gen_random_uuid()
      - name: numero
        type: varchar
        length: 24
      - name: cliente_id
        type: uuid
      - name: total
        type: numeric
        length: 12
        scale: 2
      - name: emitida_el
        type: timestamptz
        default: now()
    primaryKey:
      - id
    uniques:
      - name: uq_facturas_numero
        fields:
          - numero
    position:
      x: 120
      y: 160
  - name: factura_lineas
    schema: ventas
    comment: Llave primaria de dos campos
    fields:
      - name: factura_id
        type: uuid
      - name: linea
        type: smallint
      - name: articulo_id
        type: uuid
      - name: cantidad
        type: numeric
        length: 10
        scale: 3
      - name: precio
        type: numeric
        length: 12
        scale: 2
    primaryKey:
      - factura_id
      - linea
    position:
      x: 432
      y: 160
  - name: articulos
    schema: inventario
    fields:
      - name: id
        type: uuid
        default: gen_random_uuid()
      - name: nombre
        type: varchar
        length: 120
      - name: activo
        type: boolean
        default: 'true'
    primaryKey:
      - id
    position:
      x: 900
      y: 160
  - name: clientes
    schema: personas
    fields:
      - name: id
        type: uuid
        default: gen_random_uuid()
      - name: nombre
        type: varchar
        length: 120
      - name: correo
        type: varchar
        length: 180
    primaryKey:
      - id
    uniques:
      - name: uq_clientes_correo
        fields:
          - correo
    position:
      x: 120
      y: 700
  - name: medidas
    schema: inventario
    comment: Cuarenta campos para medir el recorrido de la rejilla
    fields:
      - name: id
        type: uuid
        default: gen_random_uuid()
