formatVersion: 1
name: Recorrido · Esquemas
engine: postgres
schemas:
  - name: ventas
    abbreviation: VEN
    color: blue
    comment: Facturación y cobros
  - name: inventario
    abbreviation: INV
    color: green
  - name: personas
    abbreviation: PER
    color: purple
  - name: reportes
    abbreviation: REP
    color: orange
    comment: Todavía sin tablas
tables:
  - name: facturas
    schema: ventas
    fields:
      - name: id
        type: integer
      - name: cliente_id
        type: integer
    primaryKey:
      - id
  - name: pagos
    schema: ventas
    fields:
      - name: id
        type: integer
      - name: factura_id
        type: integer
    primaryKey:
      - id
  - name: productos
    schema: inventario
    fields:
      - name: id
        type: integer
      - name: nombre
        type: text
    primaryKey:
      - id
  - name: clientes
    schema: personas
    fields:
      - name: id
        type: integer
      - name: nombre
        type: text
    primaryKey:
      - id
